<!-- Static Bootstrap prototype page (no backend). Cart reads/writes the
     "fas_cart" localStorage key shared with home.js and product.js.
     Checkout is a simulated success flow — see cart.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Father and Son</title>
<link rel="icon" type="image/png" href="assets/logo-father-and-son.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="cart.css">
</head>
<body>

<div class="announce"><span>100% Authentic &nbsp;·&nbsp; Free Shipping &nbsp;·&nbsp; Easy Returns</span></div>

<nav class="navbar" id="mainNav">
  <div class="navbar__left">
    <a href="home_external.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
      Home
    </a>
  </div>
  <div class="navbar__logo">
    <a href="home_external.html"><img src="assets/logo-father-and-son.png" alt="Father and Son"></a>
  </div>
  <div class="navbar__right">
    <a class="nav-icon" href="cart_external.html" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge"></span>
    </a>
    <a class="nav-icon" id="navLoginLink" href="login_external.html" aria-label="Login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <div class="user-dd-wrap" id="userDdWrap" style="display:none;position:relative;">
      <button class="nav-icon" id="userDdBtn" aria-label="Account" aria-expanded="false">
        <span id="ddAvatar" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#000;color:#fff;font-size:11px;">A</span>
      </button>
      <div class="user-dd-panel" id="userDdPanel" aria-hidden="true" style="position:absolute;right:0;top:130%;background:#fff;border:1px solid rgba(0,0,0,.1);min-width:200px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);display:none;z-index:20;">
        <p id="ddUserName" style="font-weight:600;font-size:13px;margin-bottom:2px;">—</p>
        <p id="ddUserEmail" style="font-size:11px;color:rgba(0,0,0,.5);margin-bottom:10px;">—</p>
        <a href="settings_external.html" style="display:block;font-size:12px;padding:6px 0;color:inherit;">Settings</a>
        <a href="order_history_external.html" style="display:block;font-size:12px;padding:6px 0;color:inherit;">My Orders</a>
        <a href="#" id="logoutBtn" style="display:block;font-size:12px;padding:6px 0;color:inherit;">Log Out</a>
      </div>
    </div>
  </div>
</nav>
<style>#userDdPanel.open { display: block !important; }</style>

<div class="c-page">
<form id="checkoutForm" novalidate>
<div class="page-grid row g-0">

  <!-- ── LEFT: Cart + Shipping ── -->
  <div class="left-col col-lg-8">

    <div class="s-eyebrow"><span>Your Selection</span></div>
    <h1 class="s-title">My Cart</h1>

    <div class="cart-list" id="cartList"></div>

    <div class="c-divider"></div>

    <div class="s-eyebrow"><span>Delivery Details</span></div>
    <h2 class="s-title">Shipping Address</h2>

    <div class="form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;">
      <div class="form-group">
        <div class="field-wrap">
          <input class="form-input" type="text" id="firstName" placeholder="First Name" autocomplete="given-name">
          <label class="form-label form-required" for="firstName">First Name</label>
        </div>
      </div>
      <div class="form-group">
        <div class="field-wrap">
          <input class="form-input" type="text" id="lastName" placeholder="Last Name" autocomplete="family-name">
          <label class="form-label form-required" for="lastName">Last Name</label>
        </div>
      </div>
      <div class="form-group" style="grid-column:1/-1;">
        <div class="field-wrap">
          <input class="form-input" type="text" id="street" placeholder="Street Address" autocomplete="street-address">
          <label class="form-label form-required" for="street">Street Address</label>
        </div>
      </div>
      <div class="form-group">
        <div class="field-wrap">
          <input class="form-input" type="text" id="city" placeholder="City" autocomplete="address-level2">
          <label class="form-label form-required" for="city">City</label>
        </div>
      </div>
      <div class="form-group">
        <div class="field-wrap">
          <input class="form-input" type="text" id="postal" placeholder="Postal Code" autocomplete="postal-code">
          <label class="form-label form-required" for="postal">Postal Code</label>
        </div>
      </div>
      <div class="form-group" style="grid-column:1/-1;">
        <div class="field-wrap">
          <input class="form-input" type="tel" id="phone" placeholder="Phone Number" autocomplete="tel">
          <label class="form-label form-required" for="phone">Phone Number</label>
        </div>
      </div>
    </div>
  </div>

  <!-- ── RIGHT: Order Summary ── -->
  <div class="right-col col-lg-4" id="summaryBox">
    <div class="summary-box" style="border:1px solid rgba(0,0,0,.1);padding:32px;position:sticky;top:100px;">
      <h3 style="font-family:var(--font-serif,serif);font-size:20px;margin-bottom:20px;">Order Summary</h3>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;">
        <span>Subtotal</span><span id="sumSubtotal">₱0.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:14px;color:rgba(0,0,0,.6);">
        <span>Shipping</span><span id="sumShipping">₱0.00</span>
      </div>
      <div style="border-top:1px solid rgba(0,0,0,.1);padding-top:14px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;margin-bottom:24px;">
        <span>Total</span><span id="sumTotal">₱0.00</span>
      </div>
      <button type="submit" class="place-order-btn" style="width:100%;padding:16px;background:#000;color:#fff;border:none;text-transform:uppercase;letter-spacing:.1em;font-size:12px;cursor:pointer;">
        Place Order
      </button>
      <p style="margin-top:14px;font-size:11px;color:rgba(0,0,0,.4);text-align:center;">Demo checkout — no real payment is processed.</p>
    </div>
  </div>

</div>
</form>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="cart.js"></script>
</body>
</html>
