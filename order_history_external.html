<!-- Static Bootstrap prototype page (no backend). Reads orders from the
     "fas_orders" localStorage key written by cart.js at checkout. Requires
     a mock sign-in ("fas_user") — same rule as the original PHP page. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History — Father and Son</title>
<link rel="icon" type="image/png" href="assets/logo-father-and-son.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="order_history.css">
</head>
<body>

<div class="announce"><span>100% Authentic &nbsp;·&nbsp; Free Shipping &nbsp;·&nbsp; Easy Returns</span></div>

<nav class="navbar" id="mainNav">
  <div class="navbar__left">
    <a href="home_external.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
      Home
    </a>
  </div>
  <div class="navbar__logo">
    <a href="home_external.html"><img src="assets/logo-father-and-son.png" alt="Father and Son"></a>
  </div>
  <div class="navbar__right">
    <a class="nav-icon cart-wrap" href="cart_external.html" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge"></span>
    </a>
    <div class="user-dd-wrap" id="userDdWrap" style="display:none;">
      <button class="nav-icon" id="userDdBtn" aria-label="Account" aria-expanded="false">
        <span id="ddAvatar" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#000;color:#fff;font-size:11px;">A</span>
      </button>
      <div class="user-dd-panel" id="userDdPanel" aria-hidden="true">
        <div class="dd-header">
          <div class="dd-avatar" id="ddAvatar2">A</div>
          <div class="dd-user-info">
            <span class="dd-user-name" id="ddUserName">—</span>
            <span class="dd-user-email" id="ddUserEmail">—</span>
          </div>
        </div>
        <div class="dd-body">
          <a class="dropdown-item" href="settings_external.html">Settings</a>
          <hr class="dropdown-divider">
          <a class="dropdown-item" href="order_history_external.html">My Orders</a>
          <hr class="dropdown-divider">
          <a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="c-page">
  <h1 class="s-title">Order History</h1>
  <div class="order-list" id="orderList"></div>
</div>

<!-- ════ CANCEL MODAL ════════════════════════════ -->
<div class="cancel-modal-backdrop" id="cancelModalBackdrop" role="dialog" aria-modal="true">
  <div class="cancel-modal" id="cancelModalBox">
    <div class="cancel-modal__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </div>
    <p class="cancel-modal__title">Cancel this order?</p>
    <p class="cancel-modal__body">This action cannot be undone (demo only — no real order is affected).</p>
    <span class="cancel-modal__order" id="cancelModalOrderNum"></span>
    <div class="cancel-modal__actions">
      <button class="cancel-modal__btn-keep" id="cancelModalKeep">Keep Order</button>
      <button class="cancel-modal__btn-confirm" id="cancelModalConfirm">
        <span class="cancel-modal__btn-label">Yes, Cancel</span>
      </button>
    </div>
  </div>
</div>

<footer class="c-footer">
  <p>© 2026 Father and Son. Student Academic Project.</p>
</footer>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="order_history.js"></script>
</body>
</html>
